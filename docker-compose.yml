services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
    ports: ["127.0.0.1:55433:5432"]

  api:
    build: .
    ports: ["127.0.0.1:8900:8900"]
    # PI_JUDGE: llm            # + LLM_API_KEY / PI_JUDGE_MODEL from your shell; default is the rule judge

  web:
    build: ./web
    environment:
      PRICEINTEL_API: http://api:8900
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
